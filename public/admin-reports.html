<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Admin Panel</title>
  <style>
    :root { --primary: #667eea; --danger: #F2B800; --light: #f8f8f8; --border: #e0e0e0; }
    * { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: var(--light); }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: white; border-right: 1px solid var(--border); padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
    .main { margin-left: 250px; flex: 1; }
    .header { background: white; border-bottom: 1px solid var(--border); padding: 20px 30px; }
    .content { padding: 30px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
    <link rel="stylesheet" href="color-utilities.css">
    </head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2 style="color: #F2B800; margin-bottom: 30px;">Admin</h2>
      <ul style="list-style: none;">
        <li><a href="/admin-dashboard.html" style="display: block; padding: 12px; color: #666; text-decoration: none;">Dashboard</a></li>
        <li><a href="/admin-reports.html" style="display: block; padding: 12px; color: white; background: var(--primary); border-radius: 6px;">Reports</a></li>
        <li><a href="/admin-logs.html" style="display: block; padding: 12px; color: #666; text-decoration: none;">Logs</a></li>
      </ul>
    </aside>
    <main class="main">
      <header class="header"><h1>Analytics and Reports</h1></header>
      <div class="content"><div class="card"><p style="color: #999; padding: 40px; text-align: center;">Analytics and reporting features - coming soon</p></div></div>
    </main>
  </div>
</body>
</html>
