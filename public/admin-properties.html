<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="color-utilities.css">
  <style>
    :root { --primary: #667eea; --danger: #F2B800; --light: #f8f8f8; --border: #e0e0e0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--light); }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 250px; background: white; border-right: 1px solid var(--border); padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
    .admin-main { margin-left: 250px; flex: 1; }
    .admin-header { background: white; border-bottom: 1px solid var(--border); padding: 20px 30px; }
    .admin-content { padding: 30px; }
    .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2>Shield Admin</h2>
      <ul style="list-style: none;">
        <li><a href="/admin-dashboard.html" style="display: block; padding: 12px 16px; color: #666; text-decoration: none;">Dashboard</a></li>
        <li><a href="/admin-users.html" style="display: block; padding: 12px 16px; color: #666; text-decoration: none;">Users</a></li>
        <li><a href="/admin-properties.html" style="display: block; padding: 12px 16px; color: white; background: var(--primary); border-radius: 8px;">Properties</a></li>
        <li><a href="/admin-bookings.html" style="display: block; padding: 12px 16px; color: #666; text-decoration: none;">Bookings</a></li>
        <li><a href="/admin-disputes.html" style="display: block; padding: 12px 16px; color: #666; text-decoration: none;">Disputes</a></li>
      </ul>
    </aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1>Properties Management</h1>
      </header>
      <div class="admin-content">
        <div class="content-card">
          <h2 style="margin-bottom: 20px;">All Properties</h2>
          <p style="color: #999; padding: 40px; text-align: center;">Property management features - coming soon</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
